<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="PMS — Poultry Management System">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16231a"/>
      <stop offset="100%" stop-color="#0f1a13"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5fae6d"/>
      <stop offset="100%" stop-color="#2f6b3a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2f6b3a"/>
      <stop offset="100%" stop-color="#7cc98a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5fae6d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5fae6d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <!-- drifting glow -->
    <circle cx="980" cy="160" r="260" fill="url(#glow)">
      <animate attributeName="cx" values="980;1020;980" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="r" values="260;300;260" dur="7s" repeatCount="indefinite"/>
    </circle>
    <!-- subtle grid -->
    <g stroke="#ffffff" stroke-opacity="0.04">
      <path d="M0 80H1200M0 160H1200M0 240H1200"/>
      <path d="M200 0V320M400 0V320M600 0V320M800 0V320M1000 0V320"/>
    </g>

    <!-- logo tile -->
    <g transform="translate(72 96)">
      <rect width="128" height="128" rx="28" fill="url(#green)"/>
      <text x="64" y="86" font-size="72" text-anchor="middle">🐔</text>
      <rect width="128" height="128" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.25">
        <animate attributeName="stroke-opacity" values="0.25;0.6;0.25" dur="3s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- title -->
    <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#ecefe9">
      <text x="236" y="136" font-size="44" font-weight="700" letter-spacing="-0.5">
        Poultry Management System
        <animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze"/>
      </text>
      <text x="238" y="186" font-size="22" fill="#98a094" opacity="0">
        Every bird counted. Every day recorded.
        <animate attributeName="opacity" values="0;1" begin="0.5s" dur="0.9s" fill="freeze"/>
      </text>
      <!-- rotating taglines -->
      <g font-size="17" fill="#7cc98a">
        <text x="238" y="228" opacity="0">Flocks · Sheds · Daily logs · Bird movements · Alerts
          <animate attributeName="opacity" values="0;1;1;0" begin="1s" dur="6s" repeatCount="indefinite"/>
        </text>
        <text x="238" y="228" opacity="0">English · دری · پښتو — full RTL support
          <animate attributeName="opacity" values="0;1;1;0" begin="4s" dur="6s" repeatCount="indefinite"/>
        </text>
        <text x="238" y="228" opacity="0">Next.js 15 · Prisma · shadcn/ui · Tailwind v4
          <animate attributeName="opacity" values="0;1;1;0" begin="7s" dur="6s" repeatCount="indefinite"/>
        </text>
      </g>
    </g>

    <!-- animated mini chart -->
    <g transform="translate(936 92)">
      <rect x="-20" y="-20" width="236" height="176" rx="18" fill="#1b211c" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="0" y="6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#98a094">HEN-DAY PRODUCTION %</text>
      <g stroke="#ffffff" stroke-opacity="0.06"><path d="M0 40H210M0 80H210M0 120H210"/></g>
      <g fill="url(#bar)">
        <rect x="6"   y="120" width="22" height="0" rx="4"><animate attributeName="height" values="0;74"  dur="1.2s" begin="0.2s" fill="freeze"/><animate attributeName="y" values="120;46"  dur="1.2s" begin="0.2s" fill="freeze"/></rect>
        <rect x="40"  y="120" width="22" height="0" rx="4"><animate attributeName="height" values="0;88"  dur="1.2s" begin="0.4s" fill="freeze"/><animate attributeName="y" values="120;32"  dur="1.2s" begin="0.4s" fill="freeze"/></rect>
        <rect x="74"  y="120" width="22" height="0" rx="4"><animate attributeName="height" values="0;96"  dur="1.2s" begin="0.6s" fill="freeze"/><animate attributeName="y" values="120;24"  dur="1.2s" begin="0.6s" fill="freeze"/></rect>
        <rect x="108" y="120" width="22" height="0" rx="4"><animate attributeName="height" values="0;100" dur="1.2s" begin="0.8s" fill="freeze"/><animate attributeName="y" values="120;20"  dur="1.2s" begin="0.8s" fill="freeze"/></rect>
        <rect x="142" y="120" width="22" height="0" rx="4"><animate attributeName="height" values="0;94"  dur="1.2s" begin="1.0s" fill="freeze"/><animate attributeName="y" values="120;26"  dur="1.2s" begin="1.0s" fill="freeze"/></rect>
        <rect x="176" y="120" width="22" height="0" rx="4"><animate attributeName="height" values="0;98"  dur="1.2s" begin="1.2s" fill="freeze"/><animate attributeName="y" values="120;22"  dur="1.2s" begin="1.2s" fill="freeze"/></rect>
      </g>
      <polyline points="17,46 51,32 85,24 119,20 153,26 187,22" fill="none" stroke="#6fa3e6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="200" stroke-dashoffset="200">
        <animate attributeName="stroke-dashoffset" values="200;0" dur="1.6s" begin="1.3s" fill="freeze"/>
      </polyline>
      <circle cx="187" cy="22" r="4" fill="#6fa3e6" opacity="0">
        <animate attributeName="opacity" values="0;1" begin="2.8s" dur="0.3s" fill="freeze"/>
        <animate attributeName="r" values="4;7;4" begin="3s" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="210" y="140" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" fill="#ecefe9" opacity="0">94.1%
        <animate attributeName="opacity" values="0;1" begin="2.6s" dur="0.6s" fill="freeze"/>
      </text>
    </g>
  </g>
</svg>
